<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Mirabilis Rafting Company</title>
    <meta name="author" content="Daniel H. Bautista">
    <link rel="stylesheet" href="styles/rafting.css" type="text/css">
    <meta name="description"
      content="This is the page where you input your information to contact the company.">
</head>

<body>
    <header>
        <img src="images/wwrlogo.jpg" alt="picture of rafting company logo" width="200">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Mirabilis Rafting Company</h2>
        <div class="addressandemail">
            <p>The Master Shipwright's House, Watergate St, London, United Kingdom,
                mirabilisraftingcompany@gmail.com</p>
        </div>
        <section class="mapandform">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2888.8799125608466!2d-0.028820534531996223!3d51.48566531931908!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x487602f29d42d8fb%3A0x7cc76a93a88cb10e!2sThe%20Master%20Shipwright's%20House%20%7C%20The%20Shipwright!5e1!3m2!1sen!2sus!4v1790909387485!5m2!1sen!2sus"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form>

                <div class="name-name">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="mailymail">
                    <label for="useremail">Email</label>
                    <input type="text" id="useremail" name="useremail">
                </div>


                <div class="form-row">
                    <span class="message-purpose-class">Message Purpose</span>
                    <div class="radio-group">

                        <div class="option">
                            <label for="general-inquiry">General Inquiry</label>
                            <input type="radio" id="general-inquiry" name="message-purpose">
                        </div>

                        <div class="option">
                            <label for="reservation-question">reservation Question</label>
                            <input type="radio" id="reservation-question" name="message-purpose">
                        </div>

                        <div class="option">
                            <label for="website-suggestion">Website Suggestion</label>
                            <input type="radio" id="website-suggestion" name="message-purpose">
                        </div>
                    </div>
                </div>

                <div class="textbox">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="type here"
                      rows="5"></textarea>
                </div>

                <div>
                    <input type="checkbox" id="newsletter-subscribe" name="newsletter-subscribe">
                    <label for="newsletter-subscribe">Subscribe to the monthly
                        newsletter</label>
                </div>

                <div>
                    <button type="submit">Get In Touch!</button>
                </div>

            </form>
        </section>

        <section>
            <h2>We Are Here to Serve You!</h2>
            <div class="image-row-container">
                <figure>
                    <img src="images/Alyssa Brightman.svg"
                      alt="image of company ceo Alyssa Brightman" width="200">
                    <figcaption>Alyssa Brightman, CEO</figcaption>
                </figure>
                <figure>
                    <img src="images/Arthur Cudsmith.svg"
                      alt="an oar touches the turbulent water of the river" width="200">
                    <figcaption>Arthur Cudsmith, Raftwright</figcaption>
                </figure>
                <figure>
                    <img src="images/Julio Van Hernandez.svg"
                      alt="an image of a river winding into the distance" width="200">
                    <figcaption>Julio Van Hernandez, Customer Service and Relations</figcaption>
                </figure>
                <figure>
                    <img src="images/Justinian Belthrop.svg"
                      alt="people in an inflatable raft sail above white water" width="200">
                    <figcaption>Justinian Belthrop, IT Foreman</figcaption>
                </figure>
                <figure>
                    <img src="images/Marinda De la Salva.svg"
                      alt="image of Marinda De la Salva, Ourorier - serpent whisperer" width="200">
                    <figcaption>Marinda De la Salva, Ourorier - Serpent Whisperer</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026, Mirabilis Rafting Company, Daniel H. Bautista</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/truefacebooklogo.svg" alt="facebook logo" width="100">
            </a>
            <a href="https://linkedin.com">
                <img src="images/truelinkedinlogo.svg" alt="linkedin logo" width="100">
            </a>
            <a href="https://youtube.com">
                <img src="images/trueyoutubelogo.svg" alt="youtube logo" width="100">
            </a>
        </nav>
    </footer>
</body>

</html>
