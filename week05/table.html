<DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Table Assignment</title>
        <meta name="description" content="website with a sports table on it">
        <link rel="stylesheet" href="styles/table.css">
    </head>

    <body>
        <table>
            <caption>This is the best table ever!</caption>
            <thead>
                <tr>
                    <th>League</th>
                    <th>Team</th>
                    <th>Record</th>
                    <th>Player Count</th>
                </tr>
            </thead>
            <tbody>
                <tr class="first">
                    <th rowspan="2" class="southern">Southern</th>
                    <td>Parana</td>
                    <td>52-19</td>
                    <td>23</td>
                </tr>
                <tr class="second">
                    <td>Catarina</td>
                    <td>49-24</td>
                    <td>10</td>
                </tr>
                <tr class="third">
                    <th rowspan="3" class="western">Western</th>
                    <td>Lacerda</td>
                    <td>92-70</td>
                    <td>27</td>
                </tr>
                <tr class="fourth">
                    <td>Acre</td>
                    <td>75-87</td>
                    <td>20</td>
                </tr>
                <tr class="fifth">
                    <td>Rodonia</td>
                    <td>10-7</td>
                    <td>12</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3">Total Players</th>
                    <td>92</td>
                </tr>
            </tfoot>
        </table>
    </body>

    </html>
</DOCTYPE>
